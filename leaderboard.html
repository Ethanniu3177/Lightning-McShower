    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); color: var(--ink); line-height: 1.45; min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--wall) var(--cream); background-position: center top;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

  .steam {
    position: fixed; top: -12vh; left: -10%; width: 120%; height: 50vh; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 30% 55% at 18% 20%, rgba(255,255,255,0.22), transparent 70%),
      radial-gradient(ellipse 28% 45% at 52% 5%, rgba(255,255,255,0.18), transparent 70%),
      radial-gradient(ellipse 32% 50% at 84% 18%, rgba(255,255,255,0.22), transparent 70%);
    animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translateX(-3%); opacity: 0.7; } to { transform: translateX(3%); opacity: 1; } }

  .floor {
    position: relative; z-index: 1; margin-top: auto; height: 120px;
    background: var(--penny) #CFCFCC; box-shadow: inset 0 14px 18px rgba(0,0,0,0.18);
  }
  .floor::before {
    content: ""; position: absolute; left: 0; right: 0; top: -30px; height: 30px;
    background: var(--curb) #F2F0EA; border-top: 4px solid #F2F0EA; box-shadow: 0 4px 6px rgba(0,0,0,0.25);
  }

  .app {
    position: relative; z-index: 1; width: 100%; max-width: 1100px; margin: 0 auto;
    padding: 36px clamp(16px, 5vw, 64px) 72px; display: grid; gap: 26px;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 80px; }
  h1 {
    font-family: var(--serif); font-size: 2.7rem; font-weight: 600; margin: 0; line-height: 1;
    color: #FFFFFF; text-shadow: 0 2px 3px rgba(0,0,0,0.6), 0 0 16px rgba(10,18,32,0.8);
  }
  h1 em { color: var(--brass-hi); }
  .tagline { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #FFFFFF; margin-top: 8px; text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 8px rgba(10,18,32,0.9); }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
    padding: 7px 16px; border-radius: 999px; font-weight: 600; font-size: 0.92rem; color: var(--ink);
    text-decoration: none; box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  a.pill:hover { border-color: var(--brass); }
  .pill .dot { width: 10px; height: 10px; border-radius: 50%; background: #B9BDC6; }
  .pill[data-s="ok"] .dot { background: var(--sage-deep); }
  .pill[data-s="bad"] .dot { background: var(--red); }

  /* ---------- Podium: top three, framed in brass, silver and bronze ---------- */
  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: end; }
  .podium .card { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .podium .p1 { order: 2; } .podium .p2 { order: 1; } .podium .p3 { order: 3; }
  .frame {
    --metal: linear-gradient(135deg, var(--brass-hi), var(--brass) 50%, var(--brass-deep));
    position: relative; width: 100%; max-width: 250px; padding: 10px; border-radius: 26px; background: var(--metal);
    box-shadow: 0 16px 40px rgba(6,12,24,0.4);
  }
  .p2 .frame { --metal: linear-gradient(135deg, #F4F5F7, #B9BDC6 50%, #7E8591); max-width: 210px; }
  .p3 .frame { --metal: linear-gradient(135deg, #F0C9A0, #B97A45 50%, #7F4E26); max-width: 190px; }
  .frame img, .row img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #0E1626; }
  .frame img { border-radius: 17px; }
  .medal {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--serif); font-weight: 700; font-size: 1.2rem; color: var(--ink);
    background: var(--metal); box-shadow: 0 0 0 3px #FFF, 0 3px 8px rgba(0,0,0,0.35);
  }
  .plinth {
    width: 100%; margin-top: 14px; padding: 14px 12px 16px; border-radius: 18px;
    background: var(--panel); box-shadow: 0 16px 40px rgba(6,12,24,0.35);
  }
  .p1 .plinth { padding-bottom: 46px; } .p2 .plinth { padding-bottom: 26px; }
  .score { font-family: var(--serif); font-size: 2.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .score small { font-family: var(--font); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-left: 4px; }
  .meta { font-size: 0.85rem; color: var(--ink-soft); margin-top: 4px; }

  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--sage)); }
  [data-level="sus"] { --c: var(--brass); }
  [data-level="foul"] { --c: var(--red); }
  .score { color: var(--c-text, var(--sage-deep)); }
  [data-level="sus"] .score { --c-text: var(--brass-deep); }
  [data-level="foul"] .score { --c-text: var(--red); }

  /* ---------- Everyone else ---------- */
  .panel { background: var(--panel); border: 1px solid rgba(255,255,255,0.6); border-radius: 18px; padding: 8px 20px; box-shadow: 0 16px 40px rgba(6,12,24,0.35); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 2.4rem 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .rank { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
  .row img { border-radius: 12px; }
  .row .score { font-size: 1.6rem; }
  .row .bar { max-width: 320px; }

  .x {
    border: 1.5px solid var(--line); background: #FFF; border-radius: 999px; width: 32px; height: 32px;
    display: grid; place-items: center; color: var(--ink-soft); font-size: 1rem; line-height: 1; padding: 0;
  }
  .x:hover { border-color: var(--red); color: var(--red); }
  .podium .x { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity 0.15s; }
  .frame:hover .x, .x:focus-visible { opacity: 1; }

  .empty { text-align: center; padding: 48px 20px; }
  .empty p { margin: 6px 0 0; color: var(--ink-soft); }
  .empty b { font-family: var(--serif); font-size: 1.5rem; }

  .optin {
    justify-self: center; margin: 0; padding: 8px 18px; border-radius: 999px; text-align: center;
    background: rgba(252,251,248,0.92); color: var(--ink-soft); font-size: 0.9rem; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }

  .fresh { animation: caught 1.6s ease-out; }
  @keyframes caught { 0% { box-shadow: 0 0 0 0 rgba(196,81,63,0.8); } 100% { box-shadow: 0 0 0 22px rgba(196,81,63,0); } }

  @media (max-width: 640px) {
    h1 { font-size: 2rem; }
    .podium { gap: 10px; }
    .score { font-size: 1.6rem; }
    .medal { width: 32px; height: 32px; font-size: 1rem; }
    .meta { font-size: 0.75rem; }
    .row { grid-template-columns: 1.8rem 52px minmax(0, 1fr) auto; gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="steam" aria-hidden="true"></div>

<main class="app">
  <header>
    <div>
      <h1>Hall of <em>Stench</em></h1>
      <span class="tagline">Everyone who dared, worst first</span>
    </div>
    <div class="actions">
      <span class="pill" id="status" data-s="wait" role="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
      <a class="pill" href="/">← Dashboard</a>
    </div>
  </header>

  <section class="podium" id="podium" aria-label="Top three"></section>
  <section class="panel" id="rest-panel" aria-label="Everyone else" hidden><ol class="rows" id="rest"></ol></section>
  <section class="panel empty" id="empty" hidden>
    <b>Nobody's joined yet.</b>
    <p>Only people who opt in show up here.</p>
  </section>
  <p class="optin">Want in? Raise a hand above your head at Lightning McShower for a second.
    It'll know if you've showered. Trust me.</p>
</main>
<div class="floor" aria-hidden="true"></div>

<script>
  // Same thresholds as nose.py: STINK_OFF 45, STINK_ON 65.
  const level = (s) => (s >= 65 ? "foul" : s >= 45 ? "sus" : "fresh");
  const $ = (id) => document.getElementById(id);
  let entries = [];
  let seen = null;   // ids + scores last rendered, to flash whoever just got worse

  const when = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const times = (n) => (n === 1 ? "once" : `${n} times`);

  function el(tag, props = {}, ...kids) {
    const e = Object.assign(document.createElement(tag), props);
    for (const k of kids) e.append(k);
    return e;
  }
  function photo(e) {
    return el("img", { src: `/captures/${e.photo}`, alt: `Suspect ranked ${e.rank}`, loading: "lazy" });
  }
  function scoreBlock(e) {
    const s = el("div", { className: "score" }, String(Math.round(e.peak_score)));
    s.append(el("small", {}, "stink"));
    const bar = el("div", { className: "bar" }, el("i"));
    bar.firstChild.style.width = `${Math.max(2, Math.min(100, e.peak_score))}%`;
    return [s, bar];
  }
  function removeBtn(e) {
    const b = el("button", { className: "x", type: "button", title: "Remove from the board",
                             ariaLabel: `Remove suspect ranked ${e.rank}` }, "✕");
    b.addEventListener("click", async () => {
      if (!confirm("Remove this person from the leaderboard?")) return;
      const r = await fetch(`/api/leaderboard/${e.id}`, { method: "DELETE" });
      if (r.ok) render(entries.filter((x) => x.id !== e.id));
    });
    return b;
  }

  function render(next) {
    // FLIP: remember where everyone was, redraw, then slide them from there.
    const before = new Map();
    document.querySelectorAll("[data-id]").forEach((n) => before.set(n.dataset.id, n.getBoundingClientRect()));

    entries = next.map((e, i) => ({ ...e, rank: i + 1 }));
    const top = entries.slice(0, 3), rest = entries.slice(3);

    $("podium").replaceChildren(...top.map((e) => {
      const frame = el("div", { className: "frame" }, el("span", { className: "medal" }, String(e.rank)), photo(e), removeBtn(e));
      const plinth = el("div", { className: "plinth" }, ...scoreBlock(e),
        el("div", { className: "meta" }, `Sniffed ${times(e.sightings)} · since ${when(e.first_seen)}`));
      const card = el("div", { className: `card p${e.rank}` }, frame, plinth);
      card.dataset.id = e.id; card.dataset.level = level(e.peak_score);
      return card;
    }));
    $("rest").replaceChildren(...rest.map((e) => {
      const li = el("li", { className: "row" },
        el("span", { className: "rank" }, String(e.rank)), photo(e),
        el("div", {}, ...scoreBlock(e), el("div", { className: "meta" }, `Sniffed ${times(e.sightings)} · last ${when(e.last_seen)}`)),
        removeBtn(e));
      li.dataset.id = e.id; li.dataset.level = level(e.peak_score);
      return li;
    }));
    $("podium").hidden = !top.length;
    $("rest-panel").hidden = !rest.length;
    $("empty").hidden = entries.length > 0;

    document.querySelectorAll("[data-id]").forEach((n) => {
      const was = before.get(n.dataset.id);
      const e = entries.find((x) => x.id === n.dataset.id);
      const worse = seen && (!seen.has(e.id) || seen.get(e.id) < e.peak_score);
      if (worse) (n.querySelector(".frame") || n).classList.add("fresh");
      if (!was) return;
      const now = n.getBoundingClientRect();
      const dx = was.left - now.left, dy = was.top - now.top;
      if (dx || dy) {
        n.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
                  { duration: 500, easing: "cubic-bezier(.2,.8,.2,1)" });
      }
    });
    seen = new Map(entries.map((e) => [e.id, e.peak_score]));
  }

  async function load() {
    try {
      const r = await fetch("/api/leaderboard");
      render(await r.json());
    } catch { /* the socket will retry */ }
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => {
      $("status").dataset.s = "ok"; $("status-text").textContent = "Live";
      load();   // catch up on anything missed while disconnected
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "leaderboard") render(msg.entries);
    };
    ws.onclose = () => {
      $("status").dataset.s = "bad"; $("status-text").textContent = "Bridge offline";
      setTimeout(connect, 1500);
    };
  }
  connect();
</script>
</body>
</html>
